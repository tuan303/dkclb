<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prototype cấu trúc hệ thống đăng ký câu lạc bộ ngoại khóa NSHM"
    />
    <title>NSHM Clubs — Demo đăng ký CLB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=DM+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-credit" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1v.1h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1-.4h-.1v-4h.1A1.7 1.7 0 0 0 4.2 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.6 4.2a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1v-.1h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.6a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1 .4h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.83 1c0 2-3 2-3 4M12 18h.01"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 3h2l2.5 12h10l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.7 5.3L19 9l-5.3 1.7L12 16l-1.7-5.3L5 9l5.3-1.7ZM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></symbol>
    </svg>

    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Điều hướng chính">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span>★</span></div>
          <div>
            <strong>NSHM Clubs</strong>
            <small>Cổng ngoại khóa</small>
          </div>
        </div>

        <div class="role-switcher">
          <span class="eyebrow">Chế độ xem demo</span>
          <div class="segmented" role="group" aria-label="Chọn vai trò">
            <button class="role-button active" data-role="parent">Phụ huynh</button>
            <button class="role-button" data-role="admin">Nhà trường</button>
          </div>
        </div>

        <nav id="main-nav" class="main-nav"></nav>

        <div class="sidebar-note">
          <svg class="icon"><use href="#i-spark"></use></svg>
          <div>
            <strong>Prototype BA</strong>
            <p>Dữ liệu minh họa, không phải dữ liệu thật.</p>
          </div>
        </div>
      </aside>

      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button id="menu-toggle" class="icon-button menu-button" aria-label="Mở menu">
              <svg class="icon"><use href="#i-menu"></use></svg>
            </button>
            <div>
              <p class="topbar-context" id="topbar-context">Học kỳ I · 2026–2027</p>
              <h1 id="page-title">Tổng quan</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" aria-label="Thông báo">
              <svg class="icon"><use href="#i-bell"></use></svg>
              <span class="notification-dot"></span>
            </button>
            <button id="cart-button" class="cart-button">
              <svg class="icon"><use href="#i-cart"></use></svg>
              <span>Đăng ký</span>
              <b id="cart-count">0</b>
            </button>
            <div class="profile">
              <div class="avatar" id="profile-avatar">ML</div>
              <div class="profile-copy">
                <strong id="profile-name">Mai Lan</strong>
                <small id="profile-role">Phụ huynh</small>
              </div>
            </div>
          </div>
        </header>

        <div id="page-content" class="page-content" aria-live="polite"></div>
      </main>
    </div>

    <aside id="cart-drawer" class="cart-drawer" aria-label="Giỏ đăng ký">
      <div class="drawer-head">
        <div>
          <span class="eyebrow">Bước 3/4</span>
          <h2>Giỏ đăng ký</h2>
        </div>
        <button class="icon-button" data-close-drawer aria-label="Đóng">
          <svg class="icon"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div id="cart-body" class="drawer-body"></div>
      <div id="cart-footer" class="drawer-footer"></div>
    </aside>
    <div id="drawer-overlay" class="drawer-overlay"></div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>

    <script src="./app.js"></script>
  </body>
</html>
